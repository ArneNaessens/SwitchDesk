<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SwitchDesk logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#262e3b"/>
      <stop offset="1" stop-color="#1e2530"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .up   { fill: #4cc38a; animation: blink 2.4s ease-in-out infinite; }
    .off  { fill: #3a4354; }
    .warn { fill: #e8b04a; animation: warn 1.6s ease-in-out infinite; }
    .wake { animation: wake 6s steps(1) infinite; }
    .d1 { animation-delay: .3s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.1s }
    .d4 { animation-delay: 1.5s } .d5 { animation-delay: 1.9s }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: .55 } }
    @keyframes warn  { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    @keyframes wake  { 0% { fill: #3a4354 } 45% { fill: #4cc38a } 85% { fill: #3a4354 } }
  </style>

  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#bg)"/>

  <!-- faceplate -->
  <rect x="33" y="80" width="190" height="98" rx="14" fill="#181c24" stroke="#2d3544" stroke-width="2"/>

  <!-- ports -->
  <rect class="up" x="45" y="96" width="22" height="26" rx="4"/>
  <rect class="up d1" x="74" y="96" width="22" height="26" rx="4"/>
  <rect class="off wake" x="103" y="96" width="22" height="26" rx="4"/>
  <rect class="up d2" x="132" y="96" width="22" height="26" rx="4"/>
  <rect class="up d3" x="161" y="96" width="22" height="26" rx="4"/>
  <rect class="warn" x="190" y="96" width="22" height="26" rx="4" filter="url(#glow)"/>
  <rect class="up d4" x="45" y="134" width="22" height="26" rx="4"/>
  <rect class="off" x="74" y="134" width="22" height="26" rx="4"/>
  <rect class="up d5" x="103" y="134" width="22" height="26" rx="4"/>
  <rect class="up d1" x="132" y="134" width="22" height="26" rx="4"/>
  <rect class="off" x="161" y="134" width="22" height="26" rx="4"/>
  <rect class="up d3" x="190" y="134" width="22" height="26" rx="4"/>
</svg>
